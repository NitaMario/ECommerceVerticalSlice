<div class="container mt-4">
  <div class="row">
    <div class="col-md-7">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Shipping Details</h4>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onPlaceOrder()">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input
                type="text"
                class="form-control"
                name="fullName"
                [(ngModel)]="shippingDetails.fullName"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Shipping Address</label>
              <textarea
                class="form-control"
                rows="3"
                name="address"
                [(ngModel)]="shippingDetails.address"
                required
              ></textarea>
            </div>
            <button
              type="submit"
              class="btn btn-success w-100 mt-3"
              [disabled]="isSubmitting || cartService.totalItems() === 0"
            >
              {{ isSubmitting ? "Processing..." : "Place Order" }}
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header bg-light">
          <h5 class="mb-0">Order Summary</h5>
        </div>
        <div class="card-body">
          <ul class="list-group list-group-flush mb-3">
            @for (item of cartService.getCart(); track item.productId) {
              <li class="list-group-item d-flex justify-content-between lh-sm">
                <div>
                  <h6 class="my-0">{{ item.productName }}</h6>
                  <small class="text-muted">Qty: {{ item.quantity }}</small>
                </div>
                <span class="text-muted"
                  >{{ item.price * item.quantity | currency: "USD" }}
                </span>
              </li>
            }
          </ul>

          <div
            class="d-flex justify-content-between fw-bold fs-5 text-success border-top pt-3"
          >
            <span>Total</span>
            <span> {{ cartService.totalPrice() | currency: "USD" }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
