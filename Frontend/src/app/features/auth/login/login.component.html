<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h3 class="text-center mb-4 text-primary fw-bold">Login</h3>
          @if (errorMessage) {
            <div class="alert alert-danger">{{ errorMessage }}</div>
          }

          <form (ngSubmit)="onLogin()">
            <div class="mb-3">
              <label class="form-label text-muted fw-bold">Email address</label>
              <input
                type="email"
                class="form-control form-control-lg"
                name="email"
                [(ngModel)]="credentials.email"
                required
              />
            </div>
            <div class="mb-4">
              <label class="form-label text-muted fw-bold">Password</label>
              <input
                type="password"
                class="form-control form-control-lg"
                name="password"
                [(ngModel)]="credentials.password"
                required
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-lg w-100"
              [disabled]="isLoading"
            >
              {{ isLoading ? "Logging in..." : "Login" }}
            </button>
          </form>

          <div class="text-center mt-4">
            <p class="text-muted">
              Don't have an account?
              <a routerLink="/register" class="text-decoration-none fw-bold"
                >Register Here</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
