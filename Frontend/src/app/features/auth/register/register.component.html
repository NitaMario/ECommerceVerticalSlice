<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="car shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="text-center mb-4 text-primary fw-bold">Register</h2>

          @if (errorMessage) {
            <div class="alert alert-danger">{{ errorMessage }}</div>
          }
          @if (successMessage) {
            <div class="alert alert-success">{{ successMessage }}</div>
          }

          <form (ngSubmit)="onRegister()">
            <div class="mb-3">
              <label class="form-label text-muted fw-bold">Full Name</label>
              <input
                type="text"
                class="form-control form-control-lg"
                name="name"
                [(ngModel)]="registerData.name"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label text-muted fw-bold">Email Address</label>
              <input
                type="email"
                class="form-control form-control-lg"
                name="email"
                [(ngModel)]="registerData.email"
                required
              />
            </div>
            <div class="mb-4">
              <label class="form-label text-muted fw-bold">Password</label>
              <input
                type="password"
                class="form-control form-control-lg"
                name="password"
                [(ngModel)]="registerData.password"
                required
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary btn-lg w-100"
              [disabled]="
                isLoading ||
                !registerData.name ||
                !registerData.email ||
                !registerData.password
              "
            >
              {{ isLoading ? "Creating Account..." : "Register" }}
            </button>
          </form>
          <div class="text-center mt-4">
            <p class="text-muted">
              Already have an account?
              <a routerLink="/login" class="fw-bold text-decoration-none"
                >Login Here</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
